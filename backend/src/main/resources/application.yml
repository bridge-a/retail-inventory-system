server:
  port: 8080

spring:
  application:
    name: retail-inventory-system
  datasource:
    url: jdbc:h2:file:./data/retail_inventory;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      encoding: UTF-8
